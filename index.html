<!DOCTYPE html>
<html>
<head>
  <title>Injury-Free Days</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      background: #08233f;
      overflow: hidden;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      color: #28a745;
      font-size: 180px;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #counter {
      line-height: 1;
    }
  </style>
</head>
<body>
  <div id="counter">0</div>

<script>
  const MS_PER_DAY = 1000 * 60 * 60 * 24;
  const LAST_INJURY_DATE = '2025-12-17';

  const lastInjuryUTC = Date.parse(`${LAST_INJURY_DATE}T00:00:00Z`);

  const now = new Date();
  const todayUTC = Date.UTC(
    now.getUTCFullYear(),
    now.getUTCMonth(),
    now.getUTCDate()
  );

  let daysInjuryFree =
    Math.floor((todayUTC - lastInjuryUTC) / MS_PER_DAY) + 1;

  if (daysInjuryFree < 0) daysInjuryFree = 0;

  document.getElementById("counter").textContent = daysInjuryFree;
</script>
</body>
</html>
