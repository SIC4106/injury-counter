<!DOCTYPE html>
<html>
<head>
  <title>Injury-Free Days</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      color: #28a745; /* Green text */
      font-size: 180px;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="counter">0</div>

<script>
  const MS_PER_DAY = 1000 * 60 * 60 * 24;

  // 🔧 CHANGE ONLY THIS DATE (YYYY-MM-DD)
  const LAST_INJURY_DATE = '2025-12-17';

  // Parse as UTC midnight to avoid timezone / DST issues
  const lastInjuryUTC = Date.parse(`${LAST_INJURY_DATE}T00:00:00Z`);

  const now = new Date();
  const todayUTC = Date.UTC(
    now.getUTCFullYear(),
    now.getUTCMonth(),
    now.getUTCDate()
  );

  // Inclusive calendar-day count
  let daysInjuryFree =
    Math.floor((todayUTC - lastInjuryUTC) / MS_PER_DAY) + 1;

  // Safety guard
  if (daysInjuryFree < 0) daysInjuryFree = 0;

  document.getElementById("counter").textContent = daysInjuryFree;
</script>
